

name: Build Java Code and Deploy to 4 environments

on:
  push:
    branches:
      - master

jobs:
   DEV:
    runs-on: ubuntu-latest
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    
    

    steps:
      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

          
      - name: Verify Nexus Credentials Configuration
        run: |
          grep -A 5 '<id>nexus</id>' ~/.m2/settings.xml    

      # Step 3: Build Java application
      - name: Build Application
        run: mvn clean package 

      

  
      - name: Upload Artifact to Nexus
        
        run: |
          mvn deploy -DskipTests \
            -DaltDeploymentRepository=nexus::http://100.53.44.207:8081/repository/maven-snapshots/  
      

        
          
         
          

          
       

         

   

       




          
         
       
