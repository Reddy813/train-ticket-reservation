

name: Build Java Code and Deploy to 4 environments

on:
  push:
    branches:
      - master

jobs:
   DEV:
    runs-on: ubuntu-latest
    
    

    steps:
      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Build Java application
      - name: Build Application
        run: mvn clean package 

      

  
      - name: Upload Artifact to Nexus
        run: |
          mvn org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -Dfile=target/TrainBook-1.0.0-SNAPSHOT.war \
            -DgroupId=com.vijay \
            -DartifactId=trainbook \
            -Dversion=1.0.${{ github.run_number }} \
            -Dpackaging=war \
            -DrepositoryId=nexus \
            -Durl=${{ secrets.NEXUS_HOST_URL }} \
            -DgeneratePom=true
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}  
      

        
          
         
          

          
       

         

   

       




          
         
       
