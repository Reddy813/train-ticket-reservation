

name: Build Java Code and Deploy to 4 environments

on:
  push:
    branches:
      - master

jobs:
   DEV:
    runs-on: ubuntu-latest
    
    

    steps:
      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Build Java application
      - name: validate with Maven
        run: mvn validate 

      - name: Test with maven
        run: mvn test 
        
      - name: compile with maven
        run: mvn compile 
        
      - name: package with maven
        run: mvn package

   Code-Quality:
    runs-on: ubuntu-latest   
    needs: DEV

    steps:
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      

        
          
         
          

          
       

         

   

       




          
         
       
