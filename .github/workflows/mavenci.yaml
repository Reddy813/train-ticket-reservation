name: ci pipeline to build java code and code quality by using sonarqube 
on:
   push:
     branches: master
jobs:
  build:
     runs-on: ubuntu-latest
     steps:
       - name: checkout code
         uses: actions/checkout@v5
       - name: set-up jdk
         uses: actions/setup-java@v5
         with:
            distribution: 'temurin'
            java-version: '17'
       - name: build with maven 
         run:  mvn clean package 
         
       - name: Deploy WAR to Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          WAR_FILE="target/TrainBook-1.0.0-SNAPSHOT.war"

          echo "Deploying WAR file: $WAR_FILE"

          ls -lh target/

          test -f "$WAR_FILE"

          curl --fail --show-error \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/manager/text/deploy?path=/train-ticket-reservation&update=true" \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD"
           
      
       

         

   

       




          
         
       
