

name: Build Java Code and Deploy to 4 environments

on:
  push:
    branches:
      - master

jobs:
   DEV:
    runs-on: ubuntu-latest
    
    

    steps:
      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Build Java application
      - name: validate with Maven
        run: mvn validate 

      - name: Test with maven
        run: mvn test 
        
      - name: compile with maven
        run: mvn compile 
        
      - name: package with maven
        run: mvn package

  
      - name: SonarQube Scan
        run: | 
           mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
              -Dsonar.projectKey=train-ticket-reservation\
              -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}"\
              -Dsonar.tocken="${{ secrets.SONAR_TOKEN }}"\
      

        
          
         
          

          
       

         

   

       




          
         
       
