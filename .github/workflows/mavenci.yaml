name: ci pipeline to build java code and code quality by using sonarqube 
on:
   push:
     branches: master
jobs:
  build:
     runs-on: ubuntu-latest
     steps:
       - name: checkout code
         uses: actions/checkout@v5
       - name: set-up jdk
         uses: actions/setup-java@v5
         with:
            distribution: 'temurin'
            java-version: '17'
       - name: build with maven 
         run:  mvn clean package 
       - name: deploy war to tomact
         run: |
           WAr_FILE = target/Trainbook-1.0.0-SNAPSHOT.war
           echo "Deploying war file: $wAR_FILE"
           ls -l target
           curl --fail --upload-file $WAR_FILE "$TOMCAT_URL/deploy?path=/train-ticket-reservation&update==true"  --user $TOMCAT_USERNAME:$TOMCAT_PASSWORD
         env:
           TOMACT_URL: ${{ secrets.TOMCAT_URL}}
           TOMACT_USERNAME: ${{ secrets.TOMCAT_USERNAME}}
           TOMACT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD}}
           
      
       

         

   

       




          
         
       
